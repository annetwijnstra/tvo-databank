<!DOCTYPE html>
<html>
<head>
  <title>TVO Databank</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <h1>Taalgericht Vakonderwijs</h1>

  <input id="titel" placeholder="Titel"><br><br>
  <input id="vak" placeholder="Vak"><br><br>
  <textarea id="beschrijving" placeholder="Beschrijving"></textarea><br><br>

  <button onclick="opslaan()">Opslaan</button>

  <h2>Lesideeën</h2>
  <div id="lijst"></div>

<script>
const supabase = window.supabase.createClient(
  "https://gbkuumdsvvfjzmbsrjep.supabase.co",
  "sb_publishable_a3N1Gvv-zYhRJLI4O-aepw_46sBHOjJ"
);

async function opslaan() {
  const titel = document.getElementById("titel").value;
  const vak = document.getElementById("vak").value;
  const beschrijving = document.getElementById("beschrijving").value;

  await supabase.from("lesideeen").insert([
    { titel, vak, beschrijving }
  ]);

  laden();
}

async function laden() {
  const { data } = await supabase.from("lesideeen").select("*");

  const lijst = document.getElementById("lijst");
  lijst.innerHTML = "";

  data.forEach(item => {
    lijst.innerHTML += `<p><b>${item.titel}</b> (${item.vak})<br>${item.beschrijving}</p>`;
  });
}

laden();
</script>

</body>
</html>
